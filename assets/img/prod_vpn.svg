<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <rect x="8" y="8" width="184" height="184" rx="16" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.5"/>
  <!-- Globe circles -->
  <circle cx="100" cy="90" r="50" fill="none" stroke="#818cf8" stroke-width="2" filter="url(#glow)" opacity="0.6"/>
  <ellipse cx="100" cy="90" rx="25" ry="50" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="90" x2="150" y2="90" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="55" y1="67" x2="145" y2="67" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <line x1="55" y1="113" x2="145" y2="113" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <!-- Shield lock -->
  <path d="M100 52 L115 60 L115 78 Q115 90 100 96 Q85 90 85 78 L85 60 Z" fill="#818cf8" filter="url(#glow)" opacity="0.85"/>
  <rect x="94" y="72" width="12" height="10" rx="2" fill="#0f172a"/>
  <circle cx="100" cy="70" r="5" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <text x="100" y="158" text-anchor="middle" font-family="Arial" font-size="14" fill="#818cf8" font-weight="bold" filter="url(#glow)">VPN</text>
  <text x="100" y="175" text-anchor="middle" font-family="Arial" font-size="9" fill="#94a3b8">Akses Aman &amp; Bebas</text>
</svg>
