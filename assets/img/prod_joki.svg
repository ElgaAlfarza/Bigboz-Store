<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <rect x="8" y="8" width="184" height="184" rx="16" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
  <!-- Document -->
  <rect x="55" y="35" width="90" height="115" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
  <!-- Folded corner -->
  <path d="M125 35 L145 35 L125 55 Z" fill="#0f172a"/>
  <path d="M125 35 L145 55 L125 55 Z" fill="#f59e0b" opacity="0.4"/>
  <!-- Lines on doc -->
  <rect x="65" y="65" width="70" height="5" rx="2" fill="#f59e0b" opacity="0.7" filter="url(#glow)"/>
  <rect x="65" y="78" width="60" height="4" rx="2" fill="#64748b" opacity="0.6"/>
  <rect x="65" y="90" width="65" height="4" rx="2" fill="#64748b" opacity="0.5"/>
  <rect x="65" y="102" width="55" height="4" rx="2" fill="#64748b" opacity="0.5"/>
  <rect x="65" y="114" width="50" height="4" rx="2" fill="#64748b" opacity="0.4"/>
  <!-- Checkmark -->
  <circle cx="127" cy="118" r="15" fill="#22c55e" opacity="0.15"/>
  <circle cx="127" cy="118" r="12" fill="none" stroke="#22c55e" stroke-width="2" filter="url(#glow)"/>
  <path d="M121 118 L125 122 L133 114" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Pencil -->
  <path d="M58 135 L68 125 L80 137 L70 147 Z" fill="#f59e0b" opacity="0.8"/>
  <path d="M58 135 L55 148 L68 145 Z" fill="#f59e0b" opacity="0.5"/>
  <text x="100" y="168" text-anchor="middle" font-family="Arial" font-size="10" fill="#f59e0b" font-weight="bold">JOKI TUGAS</text>
  <text x="100" y="183" text-anchor="middle" font-family="Arial" font-size="9" fill="#94a3b8">Cepat &amp; Terpercaya</text>
</svg>
