<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <rect x="8" y="8" width="184" height="184" rx="16" fill="none" stroke="#ff6600" stroke-width="2" opacity="0.4"/>
  <!-- Browser window -->
  <rect x="30" y="50" width="140" height="100" rx="8" fill="#1e293b" stroke="#ff6600" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="30" y="50" width="140" height="22" rx="8" fill="#0f172a"/>
  <rect x="30" y="62" width="140" height="10" fill="#0f172a"/>
  <circle cx="47" cy="61" r="4" fill="#ef4444"/>
  <circle cx="60" cy="61" r="4" fill="#eab308"/>
  <circle cx="73" cy="61" r="4" fill="#22c55e"/>
  <!-- Code lines -->
  <rect x="40" y="85" width="50" height="5" rx="2" fill="#ff6600" opacity="0.7" filter="url(#glow)"/>
  <rect x="40" y="97" width="80" height="4" rx="2" fill="#64748b" opacity="0.6"/>
  <rect x="48" y="108" width="60" height="4" rx="2" fill="#818cf8" opacity="0.6"/>
  <rect x="48" y="119" width="70" height="4" rx="2" fill="#22c55e" opacity="0.5"/>
  <rect x="40" y="130" width="40" height="4" rx="2" fill="#ff6600" opacity="0.5"/>
  <text x="100" y="168" text-anchor="middle" font-family="Arial" font-size="10" fill="#ff6600" font-weight="bold">BUAT WEBSITE</text>
  <text x="100" y="183" text-anchor="middle" font-family="Arial" font-size="9" fill="#94a3b8">Profesional &amp; Modern</text>
</svg>
