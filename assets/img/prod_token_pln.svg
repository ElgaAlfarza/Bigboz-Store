<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <rect x="8" y="8" width="184" height="184" rx="16" fill="none" stroke="#eab308" stroke-width="2" opacity="0.4"/>
  <!-- Lightning bolt -->
  <path d="M105 30 L75 110 L95 110 L80 170 L130 85 L108 85 L125 30 Z" fill="#eab308" filter="url(#glow)" opacity="0.9"/>
  <path d="M105 30 L75 110 L95 110 L80 170 L130 85 L108 85 L125 30 Z" fill="none" stroke="#fde047" stroke-width="1.5"/>
  <!-- Meter box -->
  <rect x="55" y="130" width="90" height="50" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.5" opacity="0.8"/>
  <text x="100" y="155" text-anchor="middle" font-family="monospace" font-size="11" fill="#fde047" font-weight="bold">TOKEN PLN</text>
  <text x="100" y="172" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">● ● ● ● ● ●</text>
</svg>
